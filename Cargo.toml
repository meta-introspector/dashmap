[package]
name = "dashmap"
version = "7.0.0-rc2"
authors = ["Joel Wejdenstål <jwejdenstal@icloud.com>"]
edition = "2021"
# rust-version = "1.70"
license = "MIT"
repository = "https://github.com/xacrimon/dashmap"
homepage = "https://github.com/xacrimon/dashmap"
description = "Blazing fast concurrent HashMap for Rust."
readme = "README.md"
documentation = "https://docs.rs/dashmap"
keywords = ["atomic", "concurrent", "hashmap"]
categories = ["concurrency", "algorithms", "data-structures"]

[features]
all = [#"raw-api", #"typesize", #"serde",
    #"rayon",
    #"arbitrary"
    ]
raw-api = []
typesize = [#"dep:typesize"
]
inline= []
inline-more = ["hashbrown/inline-more"]

[dependencies]
lock_api.workspace = true #"0.4.12"
parking_lot_core.workspace = true #"0.9.10"
equivalent.workspace = true #"1.0.1"

serde.workspace = true # = { version = "1.0.217", optional = true, features = ["derive"] }
cfg-if.workspace = true # = "1.0.0"
rayon.workspace = true # = { version = "1.10.0", optional = true }
arbitrary.workspace = true #{ version = "1.4.1", optional = true }
crossbeam-utils.workspace = true # = "0.8"
#allocator-api2 = { git = "https://github.com/meta-introspector/allocator-api2", branch = "feature/CRQ-016-nixify" }
#hashbrown = { path = "../hashbrown", default-features = false }
#hashbrown = { version = "0.15.2",  default-features = false }
hashbrown.workspace = true #{ git = "https://github.com/meta-introspector/hashbrown", branch = "feature/CRQ-016-nixify" , default-features = false }
typesize.workspace = true #{ version = "0.1.13", default-features = false, features = ["hashbrown_15"], optional = true }

[package.metadata.docs.rs]
features = ["all"]
#[workspace]